name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main  # 배포를 트리거할 브랜치 지정 (예: main, master 등)

env:
  AWS_REGION: ap-northeast-2                   # AWS 리전 (서울: ap-northeast-2)
  ECR_REPOSITORY: monew/backend                # AWS ECR 리포지토리 이름
  ECS_SERVICE: monew-backend-service           # AWS ECS 서비스 이름
  ECS_CLUSTER: monew-cluster                   # AWS ECS 클러스터 이름
  ECS_TASK_DEFINITION: .aws/task-definition.json # ECS 태스크 정의 파일 경로
  CONTAINER_NAME: monew-backend-container      # 태스크 정의에 설정된 컨테이너 이름

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐시
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Spring Boot 애플리케이션 빌드
      # 테스트를 스킵하려면 -x test를 추가합니다. CI/CD 환경에서 DB 연결이 필요한 경우 빌드가 실패할 수 있습니다.
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 5. AWS 자격 증명 설정 (GitHub Secrets에 등록된 값 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Docker 이미지 빌드, 태그 지정 및 Amazon ECR로 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 8. ECS 태스크 정의 템플릿에 새로 빌드된 이미지 적용
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 9. ECS 서비스에 태스크 정의 배포 및 업데이트
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # 10. ECS Fargate 퍼블릭 IP를 Route 53 A 레코드에 자동 갱신
      - name: Update Route 53 A record with new ECS task public IP
        env:
          CLUSTER_NAME: ${{ env.ECS_CLUSTER }}
          SERVICE_NAME: ${{ env.ECS_SERVICE }}
          HOSTED_ZONE_ID: ${{ secrets.ROUTE53_HOSTED_ZONE_ID }} # 깃허브 Repository Secret에 등록한 호스팅 영역 ID 사용
          DOMAIN_NAME: "monew.site"                              # 도메인 이름
        run: |
          echo "1. 새롭게 실행된 ECS Task ARN 조회..."
          TASK_ARN=$(aws ecs list-tasks --cluster $CLUSTER_NAME --service-name $SERVICE_NAME --query "taskArns[0]" --output text)
          echo "Task ARN: $TASK_ARN"
          
          echo "2. Task에서 네트워크 인터페이스(ENI) ID 추출..."
          ENI_ID=$(aws ecs describe-tasks --cluster $CLUSTER_NAME --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          echo "ENI ID: $ENI_ID"
          
          echo "3. ENI에서 퍼블릭 IP 조회..."
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query "NetworkInterfaces[0].Association.PublicIp" --output text)
          echo "New Public IP: $PUBLIC_IP"
          
          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "오류: 퍼블릭 IP를 가져오지 못했습니다. Task 상태를 확인해 주세요."
            exit 1
          fi
          
          echo "4. Route 53 DNS 레코드 업데이트 요청서 작성..."
          cat <<EOF > route53-update.json
          {
            "Comment": "GitHub Actions에서 자동으로 ECS Fargate 새 IP 갱신",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$DOMAIN_NAME",
                  "Type": "A",
                  "TTL": 60,
                  "ResourceRecords": [
                    {
                      "Value": "$PUBLIC_IP"
                    }
                  ]
                }
              }
            ]
          }
          EOF
          
          echo "5. Route 53 레코드 업데이트 실행..."
          aws route53 change-resource-record-sets --hosted-zone-id $HOSTED_ZONE_ID --change-batch file://route53-update.json
          echo "성공적으로 도메인의 IP를 $PUBLIC_IP 로 업데이트했습니다!"
