name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main  # 배포를 트리거할 브랜치 지정 (예: main, master 등)

env:
  AWS_REGION: ap-northeast-2                   # AWS 리전 (서울: ap-northeast-2)
  ECR_REPOSITORY: monew-backend                # AWS ECR 리포지토리 이름
  ECS_SERVICE: monew-backend-service           # AWS ECS 서비스 이름
  ECS_CLUSTER: monew-cluster                   # AWS ECS 클러스터 이름
  ECS_TASK_DEFINITION: .aws/task-definition.json # ECS 태스크 정의 파일 경로
  CONTAINER_NAME: monew-backend-container      # 태스크 정의에 설정된 컨테이너 이름

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐시
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Spring Boot 애플리케이션 빌드
      # 테스트를 스킵하려면 -x test를 추가합니다. CI/CD 환경에서 DB 연결이 필요한 경우 빌드가 실패할 수 있습니다.
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 5. AWS 자격 증명 설정 (GitHub Secrets에 등록된 값 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Docker 이미지 빌드, 태그 지정 및 Amazon ECR로 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 8. ECS 태스크 정의 템플릿에 새로 빌드된 이미지 적용
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 9. ECS 서비스에 태스크 정의 배포 및 업데이트
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
